# Part of the WebAssembly/Docker port of Lua; same license as Lua (see the
# Copyright Notice in lua.h).
#
# Builds the WebAssembly web page of Lua with both architectures:
# emscripten/build/web from make -C emscripten web WASM_WEB_ARCHS="wasm64
# wasm32" (the page, its scripts, the wasm64 module beside index.html and
# the wasm32 one in wasm32/), plus the README.txt and serve.py of
# emscripten/deploy.  The node builds are tested first (smoke test, the
# upstream testes, the harnesses of emscripten/tests/wasm on both
# architectures), then the bundle itself in Chromium and Firefox with
# Playwright.  The bundle is uploaded as the workflow artifact
# lua-wasm-web-<rev> and, for master, deployed by the deploy job to
# GitHub Pages, with the official Pages actions: the bundle is the root
# of the site, as docs/ of gh-pages was before, so the URLs are the
# same.  No branch holds the site, and there is no Jekyll pass (no
# .nojekyll needed).
#
# The site is generated by this workflow and never edited by hand: every
# deploy replaces all of it.  The web sources live on master in
# emscripten/web/.  Nothing is ever pushed: master is only read.
#
# This needs, once, Settings > Pages > Build and deployment > Source:
# GitHub Actions (it was Deploy from a branch: gh-pages, /docs).  The
# github-pages environment must allow deployments from master (the
# default branch rule that Pages sets up does).  After the switch
# nothing reads the gh-pages branch, and it can be deleted.
#
# Each deployment is recorded in the github-pages environment with the
# commit of master it was built from, and a deploy of an older commit (a
# re-run of an old run) fails instead of replacing the newer site.
name: WebAssembly bundle

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request cancels the older run; on master the
# newer run waits, so a built bundle is always deployed.
concurrency:
  group: wasm-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the version emscripten/README.md says the build is tested with
  EMSDK_VERSION: 6.0.10

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the revision
        id: rev
        run: echo "rev=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build wasm64 and wasm32
        run: |
          source ~/emsdk/emsdk_env.sh
          make -C emscripten -j"$(nproc)" web node WASM_WEB_ARCHS="wasm64 wasm32"

      # The smoke test, the upstream testes (with the 1 MB worker lane for
      # cstack.lua and errors.lua), lib-harness.js, and the repl, worker
      # and notebook harnesses on both architectures.  The jsc lane is
      # skipped: JSC is unset, the runners have no JavaScriptCore shell.
      - name: Test the node builds and the web modules
        run: |
          source ~/emsdk/emsdk_env.sh
          # emsdk_env.sh puts emsdk's node in EMSDK_NODE, not on the PATH, and
          # the runner's own node is too old for wasm64 (memory64/table64).
          make -C emscripten check NODE="$EMSDK_NODE"

      - name: Assemble the bundle
        run: |
          mkdir bundle
          cp -R emscripten/build/web/. bundle/
          cp emscripten/deploy/README.txt emscripten/deploy/serve.py bundle/
          test -f bundle/index.html -a -f bundle/lua-repl.wasm -a -f bundle/wasm32/lua-repl.wasm -a -f bundle/notebook.js
          # every @NAME@ of web/index.html was substituted
          if grep -n '@[A-Z][A-Z]*@' bundle/index.html; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: lua-wasm-web-${{ steps.rev.outputs.rev }}
          path: bundle/
          if-no-files-found: error

  # The bundle as it will be served, in real browsers: console, notebook,
  # settings, both builds (emscripten/tests/wasm/page.spec.mjs).
  page:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lua-wasm-web-${{ needs.bundle.outputs.rev }}
          path: bundle

      # node 24 has memory64, which the spec's own code does not need but
      # costs nothing; the browsers bring their own engines.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Playwright is a test tool only: it is installed outside the
      # checkout, never into the repository (which has no package.json).
      - name: Install Playwright with Chromium and Firefox
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.64.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium firefox

      # (the runner context is not available in a job's env, hence per step)
      - name: Test the page in Chromium and Firefox
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SHOTS: ${{ runner.temp }}/shots
          BROWSERS: chromium,firefox
        run: node emscripten/tests/wasm/page.spec.mjs bundle

      # WebKit has no memory64, so the page runs its wasm32 fallback there,
      # in JavaScriptCore, including P20 (deep C recursion must end in
      # Lua's "C stack overflow", not in a crash).  Informational: Linux
      # WebKit is not Safari.  The JSC shell lane with iOS-sized stacks
      # (jsc-stack.js) is local only.
      - name: Test the page in WebKit (wasm32)
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SHOTS: ${{ runner.temp }}/shots/webkit
          BROWSERS: webkit
        run: |
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps webkit
          node emscripten/tests/wasm/page.spec.mjs bundle

      - name: Upload the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lua-wasm-page-shots-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # The Pages artifact is made here, from lua-wasm-web-<rev>, not in
  # bundle: bundle does the same for every event, the Pages artifact is
  # made only after page has passed and the check below lets it be
  # deployed, and a re-run of this job alone, even days later, still
  # finds the bundle (kept 90 days) where a Pages artifact made by bundle
  # would have expired (it is kept 1 day).
  deploy:
    needs: [bundle, page]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pages and id-token (the OIDC token deploy-pages authenticates with)
    # to deploy; contents and deployments only to read, for the check
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deploy at a time, and one that started is never cancelled
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # The deployments of the github-pages environment carry the commit
      # they were built from: the newest one of master that succeeded is
      # the site served now (the one of this job is still in progress).  If
      # that commit descends from this one, this is a re-run of an old
      # run, which must not put the older bundle back.  It fails rather
      # than succeed without deploying: a successful job would record a
      # deployment of this commit, and the next check would take it for
      # the site.  A live commit with no history in common (master was
      # rewritten, or its commit is gone) does not count as newer.
      - name: Refuse to replace a newer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api=repos/$GITHUB_REPOSITORY
          deployments=$(gh api "$api/deployments?environment=github-pages&ref=$GITHUB_REF_NAME&per_page=100" \
                          --jq '.[] | "\(.id) \(.sha)"')
          live=
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "$api/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              live=$sha
              break
            fi
          done <<<"$deployments"
          if [ -z "$live" ] || [ "$live" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          if ! status=$(gh api "$api/compare/$GITHUB_SHA...$live?per_page=1" --jq .status 2>"$RUNNER_TEMP/compare.err"); then
            grep -qE 'HTTP (404|422)' "$RUNNER_TEMP/compare.err" || { cat "$RUNNER_TEMP/compare.err" >&2; exit 1; }
            status=unrelated
          fi
          if [ "$status" = ahead ]; then
            echo "::error::the site has $live, newer than $GITHUB_SHA: not deploying"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: lua-wasm-web-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/bundle

      # fails early, and clearly, when Pages is not enabled
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/bundle

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summarize the deployment
        env:
          REV: ${{ needs.bundle.outputs.rev }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed $REV: $URL" >>"$GITHUB_STEP_SUMMARY"
