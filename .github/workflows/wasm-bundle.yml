# Part of the WebAssembly/Docker port of Lua; same license as Lua (see the
# Copyright Notice in lua.h).
#
# Builds the WebAssembly web page of Lua with both architectures:
# emscripten/build/web from make -C emscripten web WASM_WEB_ARCHS="wasm64
# wasm32" (the page, its scripts, the wasm64 module beside index.html and
# the wasm32 one in wasm32/), plus the README.txt and serve.py of
# emscripten/deploy.  The node builds are tested first (smoke test, the
# upstream testes, the harnesses of emscripten/tests/wasm on both
# architectures), then the bundle itself in Chromium and Firefox with
# Playwright.  The bundle is uploaded as the workflow artifact
# lua-wasm-web-<rev> and, for master, deployed to the docs/ folder of the
# gh-pages branch, which GitHub Pages serves (Settings > Pages > Deploy
# from a branch: gh-pages, /docs).
#
# gh-pages is generated by this workflow. Never edit it by hand: every
# deploy replaces the whole branch with one new commit. The web sources
# live on master in emscripten/web/.
#
# gh-pages holds that one commit, replaced (force-pushed) by each deploy:
# a history would keep the two modules of every deploy.  Its Source:
# trailer names the commit of master it was built from, and a deploy of
# an older commit (a re-run of an old run) is refused.  Nothing else is
# ever pushed: master is only read.
name: WebAssembly bundle

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request cancels the older run; on master the
# newer run waits, so a built bundle is always deployed.
concurrency:
  group: wasm-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the version emscripten/README.md says the build is tested with
  EMSDK_VERSION: 6.0.10

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the revision
        id: rev
        run: echo "rev=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build wasm64 and wasm32
        run: |
          source ~/emsdk/emsdk_env.sh
          make -C emscripten -j"$(nproc)" web node WASM_WEB_ARCHS="wasm64 wasm32"

      # The smoke test, the upstream testes (with the 1 MB worker lane for
      # cstack.lua and errors.lua), lib-harness.js, and the repl, worker
      # and notebook harnesses on both architectures.  The jsc lane is
      # skipped: JSC is unset, the runners have no JavaScriptCore shell.
      - name: Test the node builds and the web modules
        run: |
          source ~/emsdk/emsdk_env.sh
          # emsdk_env.sh puts emsdk's node in EMSDK_NODE, not on the PATH, and
          # the runner's own node is too old for wasm64 (memory64/table64).
          make -C emscripten check NODE="$EMSDK_NODE"

      - name: Assemble the bundle
        run: |
          mkdir bundle
          cp -R emscripten/build/web/. bundle/
          cp emscripten/deploy/README.txt emscripten/deploy/serve.py bundle/
          test -f bundle/index.html -a -f bundle/lua-repl.wasm -a -f bundle/wasm32/lua-repl.wasm -a -f bundle/notebook.js
          # every @NAME@ of web/index.html was substituted
          if grep -n '@[A-Z][A-Z]*@' bundle/index.html; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: lua-wasm-web-${{ steps.rev.outputs.rev }}
          path: bundle/
          if-no-files-found: error

  # The bundle as it will be served, in real browsers: console, notebook,
  # settings, both builds (emscripten/tests/wasm/page.spec.mjs).
  page:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lua-wasm-web-${{ needs.bundle.outputs.rev }}
          path: bundle

      # node 24 has memory64, which the spec's own code does not need but
      # costs nothing; the browsers bring their own engines.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Playwright is a test tool only: it is installed outside the
      # checkout, never into the repository (which has no package.json).
      - name: Install Playwright with Chromium and Firefox
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.64.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium firefox

      # (the runner context is not available in a job's env, hence per step)
      - name: Test the page in Chromium and Firefox
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SHOTS: ${{ runner.temp }}/shots
          BROWSERS: chromium,firefox
        run: node emscripten/tests/wasm/page.spec.mjs bundle

      # WebKit has no memory64, so the page runs its wasm32 fallback there,
      # in JavaScriptCore, including P20 (deep C recursion must end in
      # Lua's "C stack overflow", not in a crash).  Informational: Linux
      # WebKit is not Safari.  The JSC shell lane with iOS-sized stacks
      # (jsc-stack.js) is local only.
      - name: Test the page in WebKit (wasm32)
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SHOTS: ${{ runner.temp }}/shots/webkit
          BROWSERS: webkit
        run: |
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps webkit
          node emscripten/tests/wasm/page.spec.mjs bundle

      - name: Upload the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lua-wasm-page-shots-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [bundle, page]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lua-wasm-web-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/bundle

      # A repository of its own, so the push carries only the bundle: no
      # history of master, and no checkout to leave credentials in.
      - name: Commit the bundle to gh-pages under docs/
        env:
          REV: ${{ needs.bundle.outputs.rev }}
          SITE: ${{ runner.temp }}/site
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init -q -b gh-pages "$SITE"
          cd "$SITE"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.extraheader "AUTHORIZATION: basic $auth"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          mkdir docs
          cp -R "$RUNNER_TEMP/bundle/." docs/
          # served as is, with no Jekyll pass (which drops _-prefixed files)
          touch docs/.nojekyll
          git add -A
          tree=$(git write-tree)
          lease=refs/heads/gh-pages:          # no gh-pages yet
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            old=$(git rev-parse FETCH_HEAD)
            lease=refs/heads/gh-pages:$old
            if [ "$(git rev-parse "$old^{tree}")" = "$tree" ]; then
              echo "gh-pages already has this bundle"
              exit 0
            fi
            src=$(git log -1 --format='%(trailers:key=Source,valueonly)' "$old")
            if [ -n "$src" ] && [ "$src" != "$GITHUB_SHA" ] &&
               git fetch -q --filter=tree:0 origin "$GITHUB_SHA" "$src" &&
               git merge-base --is-ancestor "$GITHUB_SHA" "$src"; then
              echo "::notice::gh-pages has $src, newer than $GITHUB_SHA: not deploying"
              exit 0
            fi
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy the WebAssembly web page of $REV" \
              -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
              -m "Source: $GITHUB_SHA"
          git push --force-with-lease="$lease" origin HEAD:refs/heads/gh-pages
          echo "Deployed $REV: $(git rev-parse --short HEAD)" >>"$GITHUB_STEP_SUMMARY"

      # A push made with GITHUB_TOKEN may not start the Pages build of a
      # branch-based site, so ask for one (also after a skipped deploy,
      # which retries a request that failed before)
      - name: Ask GitHub Pages to publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status ||
            echo "::warning::could not request a Pages build: is Pages set to deploy from gh-pages, /docs?"
